name: main.py CI

on:
  push:
  pull_request:

jobs:
  check-dependency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          prune-cache: true

      - run: uv sync --locked

      - run: uv run pip-audit

# Think if pylint may be a better choice for deeper search
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install ruff
        uses: astral-sh/ruff-action@ba65abf8ba7bfbcc059f7fb9712be5ba9cab6abc #v4.1.0
        with:
          version: '0.17.3'
          src: app/src
          args: 'format --check'

    #      - name: Setup python
#        uses: actions/setup-python@ff73b2463e2f3baa703f830da214b8dfeeaeccf8
#        run: install python