name: main.py CI

on:
  push:
  pull_request:

jobs:

  # Check for vulnerable dependencies'
  check-dependency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: |
            app/uv.lock
            app/pyproject.toml
          prune-cache: true

      - run: uv sync --locked

      - run: uv run pip-audit

  # Linting the code (optional)
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Ruff scanning
        uses: astral-sh/ruff-action@cad90505e97e3a2df722b6e87ba8ae976b267c32 #v4.1.0
        with:
          version: '0.17.4'
          src: app/src

#  # Secrets leaks scanning
#  gitleaks:
#    runs-on: ubuntu-latest
#    steps:
#      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
#
#      - name: Gitleaks scanning
#        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e #v3.0.0
#        with:
#          version: '8.24.2'
#        env:
#          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # Static scanning with semgrep. It checks bad code practices (SQL injections, missing input validation, etc)
  semgrep:
    runs-on: ubuntu-latest

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

#      - name: Semgrep scanning
#        run: semgrep ci
#        env:
#          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Semgrep custom rules (diff-aware)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          semgrep scan \
            --config auto \
            --baseline-commit "${{ github.event.pull_request.base.sha }}" \
            --error \
            app/src

  # Scan repo only
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Manual Trivy Setup
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 #v0.3.1
        with:
          cache: true
          version: 'v0.76.2' # It has to have "v" in the version

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          trivy-config: configs/trivy-repo-config.yaml
          scan-type: 'fs'
          format: 'table'
          ignore-unfixed: false
          severity: 'HIGH,CRITICAL'
          skip-setup-trivy: true


    #      - name: Setup python
#        uses: actions/setup-python@ff73b2463e2f3baa703f830da214b8dfeeaeccf8
#        run: install python