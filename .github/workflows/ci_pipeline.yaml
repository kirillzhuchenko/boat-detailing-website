name: main.py CI

on:
  push:
  pull_request:

jobs:

  # Check for vulnerable dependencies'
  check-dependency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          prune-cache: true

      - run: uv sync --locked

      - run: uv run pip-audit

  # Linting the code (optional)
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Ruff scanning
        uses: astral-sh/ruff-action@cad90505e97e3a2df722b6e87ba8ae976b267c32 #v4.1.0
        with:
          version: '0.17.4'
          src: app/src

  # Secrets leaks scanning
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Gitleaks scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e #v3.0.0
        with:
          version: '8.24.2'
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #      - name: Setup python
#        uses: actions/setup-python@ff73b2463e2f3baa703f830da214b8dfeeaeccf8
#        run: install python