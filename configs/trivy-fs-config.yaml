timeout: 2m
dependency-tree: true
list-all-pkgs: false
exit-code: 1

pkg:
  include-dev-deps: true
scan:
  scanners:
    - vuln
    - secret
    - misconfig
    - license
vulnerability:
  type:
    - library
  ignore-unfixed: false
vuln-type: library
format: json
output: fs-scan-result.json

# Defaults will override it even if severity is commented out in the pipeline. Keep it for demo purposes.
severity:
  - HIGH
  - CRITICAL