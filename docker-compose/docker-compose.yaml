services:

  web:
    image: app
    networks:
      - frontend
    volumes:
      - static-data:/app/src/frontend/static/images
    env_file:
      - .env
    ports:
      - ${APP_PORT}
    depends_on:
      db:
        condition: service_healthy
        restart: true

  db:
    image: postgres:16
    volumes:
      - db-data:/app/instance
    expose:
      - 5432/tcp
    env_file:
      - .env
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
    name: "db-data"
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kirill/python-scripts/boat-detailing-website/instance

  static-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STATIC_FOLDER}


networks:
  frontend:
    driver: bridge


