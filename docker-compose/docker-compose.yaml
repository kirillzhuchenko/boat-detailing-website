services:

  web:
    image: app
    networks:
      - frontend
    volumes:
      - static-data:/app/src/frontend/static/images
    env_file:
      - ../app/.env
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
        restart: true

  db:
    image: postgres:16
    volumes:
      - db-data:/etc/data
    expose:
      - 5432/tcp
    env_file:
      - ../app/.env
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
    name: "db-data"
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kirill/python-scripts/boat-detailing-website/instance

  static-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kirill/python-scripts/boat-detailing-website/app/src/frontend/static/images


networks:
  frontend:
    driver: bridge


