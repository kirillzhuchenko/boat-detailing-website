services:

  nginx:
    image: nginx:1.31.8
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
#      - static-data:/usr/share/nginx/static:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      - web
      - web1
      - web2


  web:
    image: app
    networks:
      - frontend
      - backend
    volumes:
      - static-data:/app/src/frontend/static/images:ro
    env_file:
      - .env
    expose:
      - ${APP_PORT}
    depends_on:
      db:
        condition: service_healthy
        restart: true

  web1:
    image: app
    networks:
      - frontend
      - backend
    volumes:
      - static-data:/app/src/frontend/static/images:ro
    env_file:
      - .env
    expose:
      - 5001
    depends_on:
      db:
        condition: service_healthy
        restart: true

  web2:
    image: app
    networks:
      - frontend
      - backend
    volumes:
      - static-data:/app/src/frontend/static/images:ro
    env_file:
      - .env
    expose:
      - 5002
    depends_on:
      db:
        condition: service_healthy
        restart: true


  db:
    image: postgres:16
    volumes:
      - db-data:/app/instance
    expose:
      - 5432/tcp
    env_file:
      - .env
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
    name: "db-data"
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kirill/python-scripts/boat-detailing-website/instance

  static-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STATIC_FOLDER}


networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge


