repos:

  # Gitleaks is used to scan sectets (passwords, API keys, tokens)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  # Static scanning with semgrep. It checks bad code practices (SQL injections, missing input validation, etc)
  - repo: https://github.com/semgrep/pre-commit
    rev: 'v1.169.0'
    hooks:
      - id: semgrep
        args: ['--config', 'auto', '--error', '--skip-unknown-extensions']

  # Covers vulnerable dependencies, secrets and misconfigs
  - repo: local
    hooks:
      - id: trivy-fs
        name: trivy scan
        entry: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --skip-files "**/.env" --exit-code 1 --quiet .
        language: system
        pass_filenames: false
        always_run: true